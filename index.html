<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stahlbau Kontroll-App</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#EAB312;--red:#CC1135;--bg:#1a1a1b;--sur:#242526;--sur2:#2d2e2f;
  --bor:#3a3b3c;--bor2:#4a4b4c;--txt:#e4e4e4;--grn:#4ade80;--blu:#818cf8;--ros:#f87171;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;display:flex;flex-direction:column;font-size:13px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bor2);border-radius:3px}
button,input{font-family:inherit;cursor:pointer}
input{cursor:text}

/* HEADER */
#hdr{height:52px;border-bottom:2px solid var(--gold);background:var(--sur);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
#hdr .logo{font-weight:900;font-size:16px}#hdr .logo span{color:var(--gold)}
#hdr .sub{margin-left:auto;font-size:10px;color:#555;text-align:right;line-height:1.4}

/* APP LAYOUT */
#app{display:flex;height:calc(100vh - 52px);overflow:hidden}

/* SIDEBAR */
#sidebar{width:220px;min-width:220px;background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column}
#sb-head{padding:10px 14px;border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between}
#sb-head h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#555;font-weight:700}
.btn-new{background:var(--gold);color:#000;border:none;border-radius:5px;padding:4px 10px;font-size:11px;font-weight:800}
.btn-new:hover{opacity:.85}
#proj-list{flex:1;overflow-y:auto;padding:6px}
.pi{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:7px;margin-bottom:2px;cursor:pointer;border:1px solid transparent;transition:all .12s}
.pi:hover{background:var(--sur2)}
.pi.active{background:var(--sur2);border-color:var(--gold)}
.pi .pn{font-weight:600;color:#fff;font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .pd{background:none;border:none;color:#555;font-size:13px;padding:2px 4px;border-radius:3px;line-height:1;flex-shrink:0}
.pi .pd:hover{background:rgba(204,17,53,.2);color:var(--red)}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#pbar{padding:8px 18px;border-bottom:1px solid var(--bor);background:var(--sur);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#pbar .left .nr{font-size:10px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.7px}
#pbar .left h2{font-size:15px;font-weight:800;color:#fff}
#pbar .right{display:flex;gap:8px;align-items:center}

/* SCROLL AREA */
#scroll{flex:1;overflow-y:auto;padding:14px 18px;background:var(--bg)}

/* STAT CARDS */
#stats{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:14px}
.sc{background:var(--sur);border:1px solid var(--bor);border-radius:7px;padding:9px 11px;text-align:center}
.sc .sl{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:#555;font-weight:700;margin-bottom:3px}
.sc .sv{font-size:15px;font-weight:800;color:#fff}
.sc .ss{font-size:9px;color:#555;margin-top:2px}
.sv.grn{color:var(--grn)}.sv.blu{color:var(--blu)}.sv.pos{color:var(--grn)}.sv.neg{color:var(--ros)}

/* PROGRESS BAR */
#prog-bar-wrap{height:4px;background:var(--bor);border-radius:2px;margin-bottom:12px;overflow:hidden}
#prog-bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}

/* BULK BAR */
#bulk{background:rgba(99,102,241,.12);border:1px solid #6366f1;border-radius:8px;padding:9px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#bulk .bc{font-weight:800;color:#c7d2fe;font-size:11px;padding-right:8px;border-right:1px solid rgba(99,102,241,.4)}
.bi{background:var(--bg);border:1px solid #6366f1;border-radius:4px;padding:4px 9px;font-size:11px;color:#fff;outline:none;width:105px;font-weight:700}
.bapply{background:#6366f1;color:#fff;border:none;border-radius:4px;padding:5px 13px;font-size:11px;font-weight:800}
.bapply:hover{background:#818cf8}
.bcancel{background:none;border:none;color:#a5b4fc;font-size:11px;font-weight:700}

/* ACTION BAR */
#abar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:5px;font-size:11px;font-weight:800;border:none;transition:all .12s;white-space:nowrap}
.btn-gold{background:var(--gold);color:#000}.btn-gold:hover{opacity:.85}
.btn-ghost{background:var(--sur2);border:1px solid var(--bor);color:var(--txt)}.btn-ghost:hover{background:var(--bor)}
.btn-exp{background:var(--sur2);border:1px solid var(--bor);color:var(--gold)}.btn-exp:hover{background:var(--bor)}
.btn-abw{background:rgba(204,17,53,.1);border:1px solid rgba(204,17,53,.4);color:#fca5a5}.btn-abw:hover{background:rgba(204,17,53,.2)}
.btn-del{background:rgba(204,17,53,.1);border:1px solid rgba(204,17,53,.35);color:#fca5a5;font-size:11px}.btn-del:hover{background:rgba(204,17,53,.22)}
#sw{flex:1;min-width:200px;background:var(--sur);border:1px solid var(--bor);border-radius:5px;padding:6px 11px;display:flex;align-items:center;gap:7px}
#sw:focus-within{border-color:var(--gold)}
#sw input{background:none;border:none;outline:none;color:#fff;font-size:11px;width:100%}
#sw input::placeholder{color:#444}

/* FILTER BAR */
#fbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--sur);border:1px solid var(--bor);border-radius:7px;padding:12px;margin-bottom:12px}
.ft{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:#555;font-weight:700;margin-bottom:5px}
.fchips{display:flex;flex-wrap:wrap;gap:3px}
.fscroll{max-height:72px;overflow-y:auto;background:var(--bg);border:1px solid var(--bor);border-radius:4px;padding:3px}
.chip{padding:3px 7px;border-radius:3px;font-size:10px;font-weight:700;border:1px solid var(--bor);background:var(--bg);color:#777;transition:all .1s;cursor:pointer}
.chip:hover{border-color:#666;color:#ccc}
.chip.cg{background:var(--gold);color:#000;border-color:var(--gold)}
.chip.co{background:#f97316;color:#fff;border-color:#f97316}
.chip.cb{background:#6366f1;color:#fff;border-color:#6366f1}
#freset-row{grid-column:1/-1;border-top:1px solid var(--bor);padding-top:7px;text-align:right}
.btn-rst{background:none;border:none;color:var(--red);font-size:10px;font-weight:700}
.btn-rst:hover{text-decoration:underline}

/* TABLE */
#twrap{background:var(--sur);border:1px solid var(--bor);border-radius:9px;overflow:hidden}
#tscroll{overflow-x:auto}
#tbl{width:100%;border-collapse:collapse;font-size:10px;min-width:1750px}
#tbl thead{position:sticky;top:0;z-index:5}
#tbl thead th{background:var(--bor2);color:#fff;padding:9px 9px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.55px;font-weight:800;white-space:nowrap;border-bottom:1px solid #555}
#tbl thead th.r{text-align:right}
th.gh{background:rgba(34,197,94,.12);color:#86efac}
th.bh{background:rgba(99,102,241,.12);color:#a5b4fc}
th.dh{background:rgba(0,0,0,.18)}
#tbl tbody tr{border-bottom:1px solid var(--bor);transition:background .08s}
#tbl tbody tr:hover{background:rgba(255,255,255,.025)}
#tbl tbody tr.sel{background:rgba(99,102,241,.08)}
td{padding:6px 9px;color:#ccc;white-space:nowrap}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.w{color:#fff;font-weight:800}
td.gl{color:var(--gold);font-weight:800}
td.grn{color:var(--grn);font-weight:800}
td.blu{color:var(--blu);font-weight:800}
td.pos{color:var(--grn);font-weight:800}
td.neg{color:var(--ros);font-weight:800}
td.dim{color:#444}
td.dbg{background:rgba(0,0,0,.1)}
td.gbg{background:rgba(34,197,94,.05)}
td.bbg{background:rgba(99,102,241,.05)}

/* CELL INPUTS */
.ci{background:var(--bg);border:1px solid var(--bor);border-radius:3px;padding:3px 6px;color:#fff;outline:none;font-size:10px;font-weight:700;font-family:inherit;transition:border-color .1s;width:100%}
.ci:focus{border-color:var(--gold)}
.ci.grni{color:var(--grn);border-color:rgba(74,222,128,.25)}
.ci.grni:focus{border-color:var(--grn)}
.ci.blui{color:var(--blu);border-color:rgba(129,140,248,.25)}
.ci.blui:focus{border-color:var(--blu)}
.cwrap{display:flex;align-items:center;gap:3px;background:var(--bg);border:1px solid var(--bor);border-radius:3px;padding:3px 6px;transition:border-color .1s}
.cwrap:focus-within{border-color:var(--gold)}
.cwrap .icon{color:#333;font-size:9px;flex-shrink:0}
.cwrap input{background:none;border:none;outline:none;font-size:10px;font-weight:700;font-family:inherit;width:100%}

/* CHECKBOX */
.cb{background:none;border:none;padding:2px;color:#444;display:flex;align-items:center;justify-content:center}
.cb:hover{color:var(--gold)}
.cbx{width:13px;height:13px;border:2px solid currentColor;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:900}
.cbx.on{background:var(--gold);border-color:var(--gold);color:#000}

/* WELCOME */
#welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#2a2a2b}
#welcome .wi{font-size:56px;margin-bottom:14px}
#welcome h2{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:2px}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(5px)}
.md{background:var(--sur);border:1px solid var(--bor);border-radius:14px;width:400px;max-width:95vw;overflow:hidden}
.mh{padding:16px 20px;border-bottom:1px solid var(--bor);background:var(--sur2);display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1.2px}
.mh .mx{background:none;border:none;color:#555;font-size:16px;line-height:1}.mh .mx:hover{color:#fff}
.mb{padding:20px;display:flex;flex-direction:column;gap:12px}
.mi{width:100%;background:var(--bg);border:1px solid var(--bor);border-radius:8px;padding:11px 14px;color:#fff;outline:none;font-size:13px;font-weight:700;font-family:inherit}
.mi:focus{border-color:var(--gold)}
.mf{padding:14px 20px;border-top:1px solid var(--bor);background:var(--sur2);display:flex;justify-content:flex-end;gap:10px;align-items:center}
.mcnl{background:none;border:none;color:#555;font-size:11px;font-weight:700;text-transform:uppercase}.mcnl:hover{color:#fff}
.mok{background:var(--gold);color:#000;border:none;border-radius:8px;padding:9px 24px;font-size:11px;font-weight:900;text-transform:uppercase}.mok:hover{opacity:.85}

/* TOAST */
#toast{position:fixed;bottom:18px;right:18px;padding:9px 16px;border-radius:7px;font-size:12px;font-weight:700;z-index:9999;display:none}
.tok{background:#14532d;color:var(--grn);border:1px solid var(--grn)}
.ter{background:#7f1d1d;color:#fca5a5;border:1px solid #fca5a5}

@media(max-width:1200px){#stats{grid-template-columns:repeat(4,1fr)}#fbar{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="hdr">
  <div class="logo">⚙ Stahl<span>bau</span> <span style="color:#444;font-weight:300;margin:0 8px">|</span><span style="font-weight:400;color:#777;font-size:13px">Controlling</span></div>
  <div class="sub">Hoffmeier Industrieanlagen<br>GmbH &amp; Co. KG</div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="sb-head">
      <h3>Projekte</h3>
      <button class="btn-new" onclick="openModal()">+ Neu</button>
    </div>
    <div id="proj-list"></div>
  </div>
  <div id="main">
    <div id="welcome"><div class="wi">🏗</div><h2>Projekt auswählen</h2></div>
  </div>
</div>

<!-- MODAL -->
<div class="mo" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="md">
    <div class="mh"><h3>Projekt anlegen</h3><button class="mx" onclick="closeModal()">✕</button></div>
    <div class="mb">
      <input class="mi" id="mnr" placeholder="Projektnummer" autocomplete="off" onkeydown="if(event.key==='Enter')document.getElementById('mname').focus()">
      <input class="mi" id="mname" placeholder="Projektbezeichnung" autocomplete="off" onkeydown="if(event.key==='Enter')createProject()">
    </div>
    <div class="mf">
      <button class="mcnl" onclick="closeModal()">Abbrechen</button>
      <button class="mok" onclick="createProject()">Erstellen</button>
    </div>
  </div>
</div>

<input type="file" id="fSoll" accept=".xlsx,.xls" style="display:none" onchange="loadFile(event,'soll')">
<input type="file" id="fIst"  accept=".xlsx,.xls" style="display:none" onchange="loadFile(event,'ist')">
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const S = {
  projects: {},
  activeId: null,
  ft: '',           // filter text
  fg: [],           // filter groups
  fp: [],           // filter profiles
  fgr: [],          // filter grades
  fl: [],           // filter levels
  sel: new Set(),   // selected item ids
  bGrade:'', bLen:'', bLevel:'', bComment:''
};

// ═══════════════════════════════════════════════════════════
//  PERSIST
// ═══════════════════════════════════════════════════════════
function save() {
  try { localStorage.setItem('sb_v50', JSON.stringify(S.projects)); } catch(e){}
}
function loadStorage() {
  try {
    const d = localStorage.getItem('sb_v50');
    if (!d) return;
    S.projects = JSON.parse(d);
    // cleanup legacy subtotal rows
    for (const p of Object.values(S.projects))
      if (p.allItems) p.allItems = p.allItems.filter(i => !i.isSubtotal);
    const ids = Object.keys(S.projects);
    if (ids.length) S.activeId = ids[ids.length - 1];
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════
function pn(v) {
  if (v===undefined||v===null||v==='') return 0;
  const n = parseFloat(String(v).replace(/\s/g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
}
function fmt(v, d=3) {
  if (typeof v !== 'number' || isNaN(v)) return '—';
  return v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtN(v,d=0) {
  if (typeof v !== 'number' || isNaN(v)) return '—';
  return v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function grp(profile) {
  if (!profile) return 'Sonstiges';
  const p = profile.toUpperCase().trim();
  if (/^(BLECH|PL|FL)/.test(p)) return 'Bleche';
  if (/^HEA/.test(p)) return 'HEA';
  if (/^HEB/.test(p)) return 'HEB';
  if (/^HEM/.test(p)) return 'HEM';
  if (/^IPE/.test(p)) return 'IPE';
  if (/^(U[0-9]|UPE|UNP)/.test(p)) return 'U-Profile';
  if (/^(ROR|RHS|SHS|CHS|ROHR)/.test(p)) return 'Rohre';
  if (/^(L[0-9]|WIN)/.test(p)) return 'Winkelstahl';
  if (/^T[0-9]/.test(p)) return 'T-Stahl';
  if (/^(FLACH|FB)/.test(p)) return 'Flachstahl';
  if (/^(RUND|RD)/.test(p)) return 'Rundstahl';
  return 'Sonstiges';
}

// Berechne Ist-Werte für eine Position
// Logik: Ist-Gewicht = Soll-Gewicht-Gesamt × (Ist-Stk / Soll-Stk)
// Wenn zusätzlich eine andere Ist-Länge eingetragen → weiterer Faktor
function calcIst(item, d) {
  const istQty = d?.istQty ?? null;
  if (istQty === null) return { istQty:null, istWgt:null, istArea:null, dWgt:null, dArea:null };
  const istLen  = d?.manualLength || item.len;
  const qF      = item.qty > 0 ? istQty / item.qty : 0;
  const lF      = (item.len > 0 && istLen > 0) ? istLen / item.len : 1;
  const factor  = qF * lF;
  const istWgt  = item.wgtSum * factor;
  const istArea = item.areaSum * factor;
  return { istQty, istWgt, istArea, dWgt: istWgt - item.wgtSum, dArea: istArea - item.areaSum };
}

// ═══════════════════════════════════════════════════════════
//  XLSX PARSER
// ═══════════════════════════════════════════════════════════
function mcol(headers, pats) {
  for (const pat of pats) {
    const re = new RegExp(pat, 'i');
    const i = headers.findIndex(h => re.test(String(h||'').replace(/:$/,'').trim()));
    if (i >= 0) return i;
  }
  return -1;
}
function parseXLSX(data) {
  const wb = XLSX.read(data, {type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', blankrows:false});
  const kw = /profil|profile|grade|güte|qty|stück|length|länge|weight|gewicht|area|fläche|comment|bemerk|level|ebene/i;
  let bestRow=-1, bestScore=0;
  for (let i=0; i<Math.min(25,rows.length); i++) {
    const score = rows[i].filter(c=>typeof c==='string'&&kw.test(c)).length;
    if (score>bestScore){bestScore=score;bestRow=i;}
  }
  if (bestRow<0) return null;
  const h = rows[bestRow].map(c=>String(c||'').trim().replace(/:$/,''));
  const c = {
    pro: mcol(h,['profil','profile','bauteil','bezeich','description']),
    grd: mcol(h,['grade','güte','stahl','quality','material']),
    qty: mcol(h,['qty','stück','stueck','menge','anz','pcs']),
    len: mcol(h,['^length \\[mm\\]','^länge \\[mm\\]','length$','länge$']),
    lns: mcol(h,['length sum','sum.*length','länge.*sum','sum.*länge']),
    wgt: mcol(h,['^weight \\[kg\\]','^gewicht \\[kg\\]','weight$','gewicht$']),
    wgs: mcol(h,['weight sum','sum.*weight','gewicht.*sum','gesamtgewicht']),
    are: mcol(h,['^area \\[m','^fläche \\[m','area$','fläche$']),
    ars: mcol(h,['area sum','sum.*area','fläche.*sum','gesamtfläche']),
    com: mcol(h,['comment','bemerk','notiz','remark']),
    lev: mcol(h,['level','ebene','nivelle','geschoss','etage','floor'])
  };
  if (c.pro<0) return null;
  const items=[];
  for (let i=bestRow+1; i<rows.length; i++) {
    const r=rows[i];
    const rawP=String(r[c.pro]||'').trim();
    if (!rawP) continue;
    if (/^(title|date|rev|page|projekt)/i.test(rawP)) continue;
    if (/sub.?total|gesamt|summe|^total/i.test(rawP)) continue;
    if (r.some(x=>/^\s*total\s*:/i.test(String(x||'')))) continue;
    const qty=pn(r[c.qty]), len=pn(r[c.len]), wgt=pn(r[c.wgt]);
    const wgtSum=pn(r[c.wgs])||(qty*wgt);
    const area=pn(r[c.are]);
    const areaSum=pn(r[c.ars])||(qty*area);
    if (wgtSum===0&&qty===0) continue;
    items.push({
      id:`${rawP}||${String(r[c.grd]||'').trim()}||${len}||${qty}||${i}`,
      profile:rawP, grade:String(r[c.grd]||'').trim(),
      qty, len, lenSum:pn(r[c.lns])||(qty*len),
      wgt, wgtSum, area, areaSum,
      comment:c.com>=0?String(r[c.com]||'').trim():'',
      level:c.lev>=0?String(r[c.lev]||'').trim():'',
      group:grp(rawP)
    });
  }
  return items.length ? items : null;
}

// ═══════════════════════════════════════════════════════════
//  FILE HANDLER
// ═══════════════════════════════════════════════════════════
function loadFile(e, mode) {
  const file=e.target.files[0];
  if (!file||!S.activeId) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const items=parseXLSX(new Uint8Array(ev.target.result));
    if (!items){toast('Keine Daten erkannt — Spaltenüberschriften prüfen','err');return;}
    const p=S.projects[S.activeId];
    if (mode==='soll'){
      p.allItems=[...(p.allItems||[]),...items];
      p.lists=[...(p.lists||[]),{filename:file.name,date:new Date().toLocaleDateString('de-DE'),count:items.length}];
      toast(`✓ ${items.length} Positionen geladen`,'ok');
    } else {
      items.forEach(it=>{
        if (!p.istData[it.id]) p.istData[it.id]={};
        p.istData[it.id].istQty=it.qty;
        if (it.len>0) p.istData[it.id].manualLength=it.len;
      });
      toast(`✓ Ist-Mengen: ${items.length} Positionen`,'ok');
    }
    save(); render();
  };
  reader.readAsArrayBuffer(file);
  e.target.value='';
}

//  PROJECT MANAGEMENT
// ═══════════════════════════════════════════════════════════
function openModal(){
  document.getElementById('modal').style.display='flex';
  document.getElementById('mnr').value='';
  document.getElementById('mname').value='';
  setTimeout(()=>document.getElementById('mnr').focus(),50);
}
function closeModal(){document.getElementById('modal').style.display='none';}
function createProject(){
  const nr=document.getElementById('mnr').value.trim();
  const name=document.getElementById('mname').value.trim();
  if (!nr&&!name) return;
  const id=Date.now().toString();
  S.projects[id]={id,nr,name,lists:[],istData:{},allItems:[],created:new Date().toLocaleDateString('de-DE')};
  S.activeId=id; S.sel=new Set(); S.fg=[]; S.fp=[]; S.fgr=[]; S.fl=[]; S.ft='';
  save(); closeModal(); render();
}
function selectProject(id){
  S.activeId=id; S.sel=new Set(); S.fg=[]; S.fp=[]; S.fgr=[]; S.fl=[]; S.ft='';
  render();
}
function deleteProject(id){
  if (!confirm('Projekt und alle Daten löschen?')) return;
  delete S.projects[id];
  if (S.activeId===id) S.activeId=Object.keys(S.projects)[0]||null;
  save(); render();
}
function deleteActiveProject(){
  if (S.activeId) deleteProject(S.activeId);
}

// ═══════════════════════════════════════════════════════════
//  IST DATA — sofortige Neuberechnung der Tabellenzeile
// ═══════════════════════════════════════════════════════════
function setIstQty(itemId, val) {
  const p=S.projects[S.activeId];
  if (!p.istData[itemId]) p.istData[itemId]={};
  if (val===''||val===null) delete p.istData[itemId].istQty;
  else p.istData[itemId].istQty=pn(val);
  save();
  refreshRow(itemId);
  refreshStats();
}
function setField(itemId, field, val) {
  const p=S.projects[S.activeId];
  if (!p.istData[itemId]) p.istData[itemId]={};
  if (field==='manualLength'){const n=pn(val);p.istData[itemId][field]=n>0?n:undefined;}
  else p.istData[itemId][field]=val;
  save();
  if (field==='manualLength'){refreshRow(itemId);refreshStats();}
}

// Aktualisiert nur die berechneten Zellen einer Zeile (schnell, kein Neubau)
function refreshRow(itemId) {
  const p=S.projects[S.activeId];
  if (!p) return;
  const item=(p.allItems||[]).find(i=>i.id===itemId);
  if (!item) return;
  const row=document.querySelector(`tr[data-id="${CSS.escape(itemId)}"]`);
  if (!row) return;
  const d=p.istData[itemId]||{};
  const {istQty,istWgt,istArea,dWgt,dArea}=calcIst(item,d);
  const istLen=d.manualLength||item.len;
  const cLenSum=istQty!==null?(istQty*istLen):(item.qty*item.len);

  const cells=row.querySelectorAll('td');
  // col 6 = Länge(G), col 12 = Gew.Ist, col 13 = Diff.Gew, col 14 = Fläche.Ist, col 15 = Diff.Fläche
  cells[6].textContent = fmtN(cLenSum,0);
  cells[6].className = istQty!==null ? 'r gl' : 'r dim';

  cells[12].textContent = istWgt!==null ? fmt(istWgt,3) : '—';
  cells[12].className = 'r grn gbg';

  // Differenz Gewicht
  cells[13].textContent = dWgt!==null ? ((dWgt>0?'+':'')+fmt(dWgt,3)) : '—';
  cells[13].className = 'r ' + (dWgt===null?'dim': Math.abs(dWgt)<0.0005?'dim':dWgt<0?'neg':'pos');

  // Fläche Ist
  if (cells[14]) {
    cells[14].textContent = istArea!==null ? fmt(istArea,3) : '—';
    cells[14].className = 'r blu gbg';
  }
  // Differenz Fläche
  if (cells[15]) {
    cells[15].textContent = dArea!==null ? ((dArea>0?'+':'')+fmt(dArea,3)) : '—';
    cells[15].className = 'r ' + (dArea===null?'dim':Math.abs(dArea)<0.000001?'dim':dArea<0?'neg':'pos');
  }
}

// ═══════════════════════════════════════════════════════════
//  STATS
// ═══════════════════════════════════════════════════════════
function getFiltered() {
  const p=S.projects[S.activeId];
  if (!p) return [];
  let items=p.allItems||[];
  if (S.fg.length) items=items.filter(i=>S.fg.includes(i.group));
  if (S.fp.length) items=items.filter(i=>S.fp.includes(i.profile));
  if (S.fgr.length) items=items.filter(i=>S.fgr.includes(p.istData[i.id]?.manualGrade||i.grade||'---'));
  if (S.fl.length) items=items.filter(i=>S.fl.includes(p.istData[i.id]?.manualLevel||i.level||'[Ohne Ebene]'));
  if (S.ft) {
    const q=S.ft.toLowerCase();
    items=items.filter(i=>
      i.profile.toLowerCase().includes(q)||
      i.grade.toLowerCase().includes(q)||
      (p.istData[i.id]?.manualGrade||'').toLowerCase().includes(q)||
      (i.level||'').toLowerCase().includes(q)||
      (p.istData[i.id]?.manualLevel||'').toLowerCase().includes(q)||
      (p.istData[i.id]?.manualComment||'').toLowerCase().includes(q)||
      (i.comment||'').toLowerCase().includes(q)
    );
  }
  return items;
}
function calcStats(items) {
  const p=S.projects[S.activeId];
  let sW=0,sA=0,iW=0,iA=0,eP=0,swC=0,saC=0;
  items.forEach(i=>{
    sW+=i.wgtSum; sA+=i.areaSum;
    const r=calcIst(i,p.istData[i.id]);
    if (r.istQty!==null){eP++;iW+=r.istWgt;iA+=r.istArea;swC+=i.wgtSum;saC+=i.areaSum;}
  });
  return {sW,sA,iW,iA,eP,total:items.length,dW:iW-swC,dA:iA-saC,prog:items.length?eP/items.length*100:0};
}
function refreshStats() {
  const p=S.projects[S.activeId];
  if (!p) return;
  const items=getFiltered();
  const st=calcStats(items);
  const set=(id,val,sub,cls)=>{
    const el=document.getElementById(id);
    if (!el) return;
    const sv=el.querySelector('.sv');
    const ss=el.querySelector('.ss');
    if (sv){sv.textContent=val;sv.className='sv'+(cls?' '+cls:'');}
    if (ss&&sub!==undefined) ss.textContent=sub;
  };
  set('st-sw',fmt(st.sW,3),fmt(st.sW/1000,3)+' t');
  set('st-sa',fmt(st.sA,3)+' m²','');
  set('st-iw',fmt(st.iW,3),fmt(st.iW/1000,3)+' t','grn');
  set('st-ia',fmt(st.iA,3)+' m²','','blu');
  set('st-dw',(st.dW>0?'+':'')+fmt(st.dW,3)+' kg','',Math.abs(st.dW)<0.001?'':st.dW<0?'neg':'pos');
  set('st-da',(st.dA>0?'+':'')+fmt(st.dA,3)+' m²','',Math.abs(st.dA)<0.00001?'':st.dA<0?'neg':'pos');
  set('st-pr',fmt(st.prog,1)+'%',`${st.eP}/${st.total} Pos.`);
  const pb=document.getElementById('prog-bar-fill');
  if (pb) pb.style.width=Math.min(st.prog,100)+'%';
}

// ═══════════════════════════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════════════════════════
function doExport(onlyDiff) {
  const p=S.projects[S.activeId];
  if (!p) return;
  let items=getFiltered();
  if (onlyDiff) items=items.filter(it=>{
    const d=p.istData[it.id];
    const r=calcIst(it,d);
    if (r.istQty===null) return false;
    const ig=d?.manualGrade||it.grade;
    const il=d?.manualLength||it.len;
    return Math.abs(r.dWgt)>0.0005||ig!==it.grade||Math.abs(il-it.len)>0.01;
  });
  if (!items.length){toast('Keine Positionen zum Exportieren','err');return;}
  const r3=n=>Math.round(n*1000)/1000;
  const rows=items.map(it=>{
    const d=p.istData[it.id]||{};
    const r=calcIst(it,d);
    const istQty=r.istQty??0, istWgt=r.istWgt??0, istArea=r.istArea??0;
    const istLen=d.manualLength||it.len;
    return {
      'Profil':it.profile,'Material Soll':it.grade,'Material Ist':d.manualGrade||it.grade,
      'Länge Einzel Soll [mm]':r3(it.len),'Länge Ist [mm]':r3(istLen),'Länge Gesamt Soll [mm]':r3(it.lenSum),
      'Stück Soll':it.qty,'Stück Ist':istQty,
      'Gew. Soll [kg]':r3(it.wgtSum),'Gew. Ist [kg]':r3(istWgt),'Gew. Δ [kg]':r3(r.dWgt??0),
      'Fläche Soll [m²]':r3(it.areaSum),'Fläche Ist [m²]':r3(istArea),'Fläche Δ [m²]':r3(r.dArea??0),
      'Ebene':d.manualLevel||it.level||'','Kommentar':d.manualComment||it.comment||''
    };
  });
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb2=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb2,ws,onlyDiff?'Abweichungen':'Gesamtliste');
  XLSX.writeFile(wb2,`${onlyDiff?'ABW':'EXPORT'}_${p.nr||p.name}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

// ═══════════════════════════════════════════════════════════
//  BULK
// ═══════════════════════════════════════════════════════════
function applyBulk() {
  const p=S.projects[S.activeId];
  if (!p) return;
  S.sel.forEach(id=>{
    if (!p.istData[id]) p.istData[id]={};
    if (S.bGrade!='') p.istData[id].manualGrade=S.bGrade;
    if (S.bLen!='') p.istData[id].manualLength=pn(S.bLen);
    if (S.bLevel!='') p.istData[id].manualLevel=S.bLevel;
    if (S.bComment!='') p.istData[id].manualComment=S.bComment;
  });
  S.sel=new Set(); S.bGrade=''; S.bLen=''; S.bLevel=''; S.bComment='';
  save(); render();
}

// ═══════════════════════════════════════════════════════════
//  SELECTION
// ═══════════════════════════════════════════════════════════
function toggleSel(id){
  if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id);
  render();
}
function toggleAll(){
  const items=getFiltered();
  if (S.sel.size===items.length) S.sel=new Set();
  else S.sel=new Set(items.map(i=>i.id));
  render();
}

// ═══════════════════════════════════════════════════════════
//  FILTER
// ═══════════════════════════════════════════════════════════
function tog(arr, val){const i=arr.indexOf(val);i>=0?arr.splice(i,1):arr.push(val);}
function tgG(v){tog(S.fg,v);S.fp=[];render();}
function tgP(v){tog(S.fp,v);render();}
function tgGr(v){tog(S.fgr,v);render();}
function tgL(v){tog(S.fl,v);render();}
function tgSW(v){S.ft=v;renderTable();refreshStats();}
function resetF(){S.fg=[];S.fp=[];S.fgr=[];S.fl=[];S.ft='';render();}

// ═══════════════════════════════════════════════════════════
//  KEYBOARD NAV (Enter → nächste Zeile)
// ═══════════════════════════════════════════════════════════
function navEnter(e,idx){
  if (e.key!=='Enter') return;
  e.preventDefault();
  const inputs=document.querySelectorAll('input[data-ist]');
  if (inputs[idx+1]){inputs[idx+1].focus();inputs[idx+1].select();}
}

// ═══════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════
function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.className=type==='ok'?'tok':'ter'; t.textContent=msg; t.style.display='block';
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',3000);
}

function renderSidebar(){

  el.innerHTML=ids.map(id=>{
    const p=S.projects[id];
    return `<div class="pi${id===S.activeId?' active':''}" onclick="selectProject('${id}')">
      <span class="pn">${p.nr?`[${p.nr}] `:''}${p.name}</span>

//  RENDER TABLE ONLY (für Suche ohne vollen Rebuild)

function renderTable(){
  const p=S.projects[S.activeId];
  if (!p) return;
  const items=getFiltered();
  const tbody=document.getElementById('tbody');
  if (!tbody) return;
  tbody.innerHTML=buildRows(items,p);
}

function buildRows(items,p){
  if (!items.length) return `<tr><td colspan="17" style="text-align:center;padding:40px;color:#444">Keine Positionen — Soll-Liste laden oder Filter anpassen</td></tr>`;
  const selAll=S.sel.size===items.length&&items.length>0;
  return items.map((item,idx)=>{
    const d=p.istData[item.id]||{};
    const {istQty,istWgt,istArea,dWgt,dArea}=calcIst(item,d);
    const istLen=d.manualLength||item.len;
    const cLenSum=istQty!==null?(istQty*istLen):(item.qty*item.len);
    const sel=S.sel.has(item.id);
    const mGrade=d.manualGrade??'';
    const mLevel=d.manualLevel??item.level??'';
    const mComment=d.manualComment??item.comment??'';
    const mLen=d.manualLength??'';
    const dWgtCls=dWgt===null?'r dim':Math.abs(dWgt)<0.0005?'r dim':dWgt<0?'r neg':'r pos';
    const dAreCls=dArea===null?'r dim':Math.abs(dArea)<0.000001?'r dim':dArea<0?'r neg':'r pos';

    return `<tr class="${sel?'sel':''}" data-id="${item.id}">
      <td><button class="cb" onclick="toggleSel('${item.id}')">${cbHtml(sel)}</button></td>
      <td class="w">${item.profile}</td>
      <td><span style="background:var(--bg);border:1px solid var(--bor);padding:2px 6px;border-radius:3px;font-size:9px;font-family:monospace;color:#888">${item.grade||'---'}</span></td>
      <td class="bbg"><input class="ci blui" style="width:88px" value="${mGrade}" placeholder="${item.grade||'S...'}" onchange="setField('${item.id}','manualGrade',this.value)"></td>
      <td class="r dim dbg">${fmtN(item.len,0)}</td>
      <td class="bbg"><input class="ci blui" style="width:72px;text-align:right" type="number" value="${mLen}" placeholder="${item.len}" onchange="setField('${item.id}','manualLength',this.value)"></td>
      <td class="${istQty!==null?'r gl dbg':'r dim dbg'}">${fmtN(cLenSum,0)}</td>
      <td class="r" style="color:#777">${item.qty}</td>
      <td class="r dim dbg">${fmt(item.wgt,3)}</td>
      <td class="r w dbg">${fmt(item.wgtSum,3)}</td>
      <td class="r blu">${fmt(item.areaSum,3)}</td>
      <td class="gbg"><input class="ci grni" style="width:65px;text-align:right" type="number" data-ist="${idx}" value="${istQty!==null?istQty:''}" placeholder="${item.qty}" onchange="setIstQty('${item.id}',this.value)" onkeydown="navEnter(event,${idx})"></td>
      <td class="r grn gbg">${istWgt!==null?fmt(istWgt,3):'—'}</td>
      <td class="${dWgtCls}">${dWgt!==null?((dWgt>0?'+':'')+fmt(dWgt,3)):'—'}</td>
      <td class="r blu gbg">${istArea!==null?fmt(istArea,3):'—'}</td>
      <td class="${dAreCls}">${dArea!==null?((dArea>0?'+':'')+fmt(dArea,3)):'—'}</td>
      <td><div class="cwrap" style="min-width:110px"><span class="icon">▤</span><input value="${mLevel}" placeholder="Ebene..." style="color:#a5b4fc;font-weight:700" onchange="setField('${item.id}','manualLevel',this.value)"></div></td>
      <td><div class="cwrap" style="min-width:130px"><span class="icon">✎</span><input value="${mComment}" placeholder="Notiz..." style="color:#888" onchange="setField('${item.id}','manualComment',this.value)"></div></td>
    </tr>`;
  }).join('');
}
